<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SAYAÇ - Taşma Uyarı Toast</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;family=JetBrains+Mono:wght@400;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#2e3545",
                        "surface-container-lowest": "#070e1d",
                        "surface-container-high": "#232a3a",
                        "on-tertiary": "#502400",
                        "primary": "#adc6ff",
                        "on-surface": "#dce2f7",
                        "inverse-on-surface": "#293040",
                        "tertiary-fixed": "#ffdcc6",
                        "on-secondary-fixed-variant": "#304671",
                        "outline": "#8c909f",
                        "error": "#ffb4ab",
                        "inverse-surface": "#dce2f7",
                        "surface-dim": "#0c1322",
                        "on-primary": "#002e6a",
                        "inverse-primary": "#005ac2",
                        "error-container": "#93000a",
                        "tertiary": "#ffb786",
                        "secondary-container": "#304671",
                        "tertiary-fixed-dim": "#ffb786",
                        "on-primary-fixed": "#001a42",
                        "on-tertiary-fixed": "#311400",
                        "on-surface-variant": "#c2c6d6",
                        "surface-container": "#191f2f",
                        "surface-container-highest": "#2e3545",
                        "secondary-fixed-dim": "#b1c6f9",
                        "secondary": "#b1c6f9",
                        "primary-fixed-dim": "#adc6ff",
                        "tertiary-container": "#df7412",
                        "on-primary-fixed-variant": "#004395",
                        "on-background": "#dce2f7",
                        "on-secondary-container": "#9fb5e7",
                        "on-tertiary-fixed-variant": "#723600",
                        "on-secondary": "#182f59",
                        "surface": "#0c1322",
                        "surface-bright": "#323949",
                        "on-error": "#690005",
                        "background": "#0c1322",
                        "primary-fixed": "#d8e2ff",
                        "on-secondary-fixed": "#001a42",
                        "surface-container-low": "#141b2b",
                        "primary-container": "#4d8eff",
                        "secondary-fixed": "#d8e2ff",
                        "outline-variant": "#424754",
                        "on-primary-container": "#00285d",
                        "surface-tint": "#adc6ff",
                        "on-tertiary-container": "#461f00",
                        "on-error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"],
                        "mono": ["JetBrains Mono"]
                    }
                }
            }
        }
    </script>
<style>
        .glow-effect {
            text-shadow: 0 0 40px rgba(173, 198, 255, 0.1);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body h-screen flex flex-col md:flex-row overflow-hidden">
<!-- SideNavBar (Web) -->
<nav class="hidden md:flex flex-col h-full py-8 bg-[#141b2b] text-[#adc6ff] font-['Inter'] text-sm tracking-wide h-full w-64 fixed left-0 border-r-0 no-shadows z-20">
<div class="px-8 mb-12">
<h1 class="text-lg font-black text-[#adc6ff] tracking-tighter">PRECISION TECH</h1>
<p class="text-xs text-on-surface-variant opacity-70 mt-1">V1.0.4-KINETIC</p>
</div>
<ul class="flex flex-col gap-2 pr-4">
<li>
<a class="flex items-center gap-4 px-8 py-3 bg-[#232a3a] text-[#adc6ff] rounded-r-full mr-4 transition-colors duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-medium">Panel</span>
</a>
</li>
<li>
<a class="flex items-center gap-4 px-8 py-3 text-[#on_surface_variant] hover:text-white hover:bg-[#191f2f] rounded-r-full transition-colors duration-200" href="#">
<span class="material-symbols-outlined">history</span>
<span>Geçmiş</span>
</a>
</li>
<li>
<a class="flex items-center gap-4 px-8 py-3 text-[#on_surface_variant] hover:text-white hover:bg-[#191f2f] rounded-r-full transition-colors duration-200" href="#">
<span class="material-symbols-outlined">query_stats</span>
<span>Analiz</span>
</a>
</li>
<li>
<a class="flex items-center gap-4 px-8 py-3 text-[#on_surface_variant] hover:text-white hover:bg-[#191f2f] rounded-r-full transition-colors duration-200" href="#">
<span class="material-symbols-outlined">settings</span>
<span>Ayarlar</span>
</a>
</li>
</ul>
</nav>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col md:ml-64 relative h-full">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-6 py-4 bg-[#0c1322] font-['Inter'] font-medium tracking-[0.05em] uppercase text-[0.75rem] top-0 no-shadows z-10 relative">
<div class="flex items-center gap-4">
<span class="text-xl font-bold tracking-tighter text-[#adc6ff] md:hidden">SAYAÇ</span>
</div>
<div class="flex items-center gap-2">
<button class="p-2 text-[#adc6ff] hover:bg-[#191f2f] rounded-full transition-all duration-300 active:scale-95 transition-transform cubic-bezier(0.4,0,0.2,1)">
<span class="material-symbols-outlined">settings_input_antenna</span>
</button>
<button class="p-2 text-[#adc6ff] hover:bg-[#191f2f] rounded-full transition-all duration-300 active:scale-95 transition-transform cubic-bezier(0.4,0,0.2,1)">
<span class="material-symbols-outlined">dark_mode</span>
</button>
<button class="p-2 text-[#adc6ff] hover:bg-[#191f2f] rounded-full transition-all duration-300 active:scale-95 transition-transform cubic-bezier(0.4,0,0.2,1)">
<span class="material-symbols-outlined">keyboard_command_key</span>
</button>
</div>
</header>
<!-- Canvas -->
<div class="flex-1 flex flex-col items-center justify-center p-6 relative">
<!-- Main Counter Display -->
<div class="flex flex-col items-center mb-16 relative">
<div class="text-[3.5rem] font-mono font-bold text-primary glow-effect leading-none mb-4">
                    +999.999.999
                </div>
<div class="text-xs font-label text-on-surface-variant tracking-[0.05em] uppercase">
                    Maksimum Kapasite
                </div>
</div>
<!-- Action Controls -->
<div class="flex gap-4 items-center">
<button class="flex items-center justify-center w-16 h-16 bg-surface-container-highest rounded-xl text-on-surface hover:bg-surface-bright transition-all duration-300 active:scale-95">
<span class="material-symbols-outlined">remove</span>
</button>
<button class="flex items-center justify-center w-24 h-24 rounded-xl text-surface-container-lowest transition-all duration-300 active:scale-95" style="background: linear-gradient(135deg, #adc6ff 0%, #4d8eff 100%);">
<span class="material-symbols-outlined text-4xl">add</span>
</button>
<button class="flex items-center justify-center w-16 h-16 border border-outline border-opacity-20 rounded-xl text-outline hover:text-on-surface hover:border-opacity-50 transition-all duration-300 active:scale-95">
<span class="material-symbols-outlined">refresh</span>
</button>
</div>
<!-- Toast Notification -->
<div class="absolute bottom-8 right-8 flex items-center gap-3 bg-tertiary-container text-on-tertiary-container px-6 py-4 rounded-xl shadow-[0_8px_32px_rgba(223,116,18,0.2)] z-50">
<span class="material-symbols-outlined">warning</span>
<span class="font-body text-sm font-medium">Sayaç maksimum değere ulaştı (+999.999.999)</span>
</div>
</div>
</main>
</body></html>
